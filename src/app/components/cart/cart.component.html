<div *ngIf="cartItems.length > 0; else emptyCart">
  <h2>Carrello</h2>
  <ul>
    <li *ngFor="let item of cartItems">
      {{ item.nome }} - {{ item.prezzo }}€
      <button (click)="removeFromCart(item.id)">Rimuovi</button>
    </li>
  </ul>
</div>

<ng-template #emptyCart>
  <p>Il carrello è vuoto.</p>
</ng-template>
