<!-- identifica tue tipologie di cards, quelle prodotto(image) e categoria
   -->
<div *ngIf="image">
  <ng-container *ngIf="image.categoria; else noCategory">
    <a [routerLink]="['shop/product', image.id]">
      <img [src]="sds.getFullImageUrl(image.immagine)" [alt]="image.nome">
    </a>
  </ng-container>
  <ng-template #noCategory>
    <a [routerLink]="['shop/category', image.category]">
      <img [src]="sds.getFullImageUrl(image.immagine)" alt="">
    </a>
  </ng-template>
</div>
