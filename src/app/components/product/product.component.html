<section *ngIf="product">
  <div class="divImg">
    <p class="rating">{{product.best_seller | starRating}}</p>
    <img [src]="this.sds.getFullImageUrl(product.immagine)" [alt]="product.nome">
  </div>
  <h1>{{product.nome}}</h1>
  <p class="cat">{{product.categoria}}</p>
  <p class="prz">Prezzo {{product.prezzo | currency:'EUR':'symbol'}}</p>
  <div class="divColor">
    <ul style="display: flex; justify-content: space-around;">
      <li *ngFor="let c of product.colori_disponibili">
        <input style="display: none;" type="radio" name="colore" [id]="c" (change)="selectColor(c)">
        <label style="cursor: pointer;" [innerHTML]="c | color" [for]="c">{{c}}</label>
      </li>
    </ul>
  </div>
  <div class="divTaglia">
    <ul>
      <li *ngFor="let t of product.taglie_disponibili">
        <input type="radio" name="taglia" [id]="t" (change)="selectSize(t)">
        <label [for]="t">{{t}}</label>
      </li>
    </ul>
  </div>
  <button class="btnCart" [disabled]="!selectedColor || !selectedSize" (click)="addToCart()">Aggiungi al carrello</button>
  <p class="desc" style="margin-top: 25px;">{{product.descrizione}}</p>

  <app-cart-confirmation></app-cart-confirmation>
</section>
